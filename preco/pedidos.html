<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB | Pedidos</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.head{background:#0b1d2d;color:#fff;padding:20px;border-radius:14px;margin-bottom:14px}.head h1{margin:0 0 5px}.head p{margin:0;color:#c9d6e1}.card{background:#fff;border:1px solid #dbe3eb;border-radius:13px;padding:17px;margin-bottom:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}input,select{padding:11px;border:1px solid #cbd6e0;border-radius:8px;font-size:15px}button,a{border:0;border-radius:8px;padding:11px 14px;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#1268a8;color:#fff}.secondary{background:#e8eef4;color:#17324b}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 7px;border-bottom:1px solid #e6ebf0;text-align:left}th{background:#f7f9fb}.muted{color:#68788a;font-size:12px}.details{margin-top:10px;background:#f7f9fb;border-radius:8px;padding:10px;display:none}.details table{font-size:12px}</style></head><body><div class="wrap"><header class="head"><h1>AB | Pedidos salvos</h1><p>Pedidos exclusivos do módulo de precificação.</p></header><div class="bar"><a class="primary" href="index.html">← Novo pedido</a><button class="secondary" id="atualizar">Atualizar</button></div><section class="card"><div class="bar"><input id="busca" placeholder="Buscar cliente ou nº do pedido"><select id="status"><option value="">Todos os status</option><option>Orçamento</option><option>Pedido</option><option>Venda</option></select></div><div class="scroll"><table><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Status</th><th>Total</th><th>Markup</th><th></th></tr></thead><tbody id="lista"></tbody></table></div><div id="msg" class="muted" style="margin-top:10px"></div></section></div><script>const URL="https://divokbonqrmpindszoqv.supabase.co",KEY="sb_publishable_sCTeIxcTB-oUswA-QVP0Wg_LrlGgjhY";let orders=[];const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});async function api(path,opt={}){const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",...(opt.headers||{})}});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.hint||t||"Erro");return d}function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function render(){const q=$("busca").value.toLowerCase().trim(),st=$("status").value;const rows=orders.filter(o=>(!st||o.status===st)&&(!q||String(o.id).includes(q)||(o.customer_name||"").toLowerCase().includes(q))).map(o=>'<tr><td>'+o.id+'</td><td>'+new Date(o.created_at).toLocaleString("pt-BR")+'</td><td>'+esc(o.customer_name||"")+'</td><td>'+esc(o.status||"")+'</td><td>'+money(o.total)+'</td><td>'+Number(o.markup_percent||0).toFixed(2)+'%</td><td><button class="secondary" data-open="'+o.id+'">Itens</button></td></tr><tr><td colspan="7"><div class="details" id="d'+o.id+'"></div></td></tr>').join("");$("lista").innerHTML=rows||'<tr><td colspan="7">Nenhum pedido encontrado.</td></tr>'}async function load(){try{orders=await api("/rest/v1/preco_orders?select=*&order=created_at.desc")||[];render();$("msg").textContent=orders.length+" pedido(s) encontrado(s)."}catch(e){$("msg").textContent="Erro ao carregar pedidos: "+e.message}}$("atualizar").addEventListener("click",load);$("busca").addEventListener("input",render);$("status").addEventListener("change",render);$("lista").addEventListener("click",async e=>{const b=e.target.closest("[data-open]");if(!b)return;const id=b.dataset.open,el=$("d"+id);if(el.style.display==="block"){el.style.display="none";return}try{const data=await api("/rest/v1/preco_order_items?select=*&order_id=eq."+encodeURIComponent(id)+"&order=id");el.innerHTML='<table><thead><tr><th>Produto</th><th>Qtd.</th><th>Preço</th><th>Total</th><th>Markup</th></tr></thead><tbody>'+(data||[]).map(x=>'<tr><td>'+esc(x.product_name)+'</td><td>'+x.quantity+'</td><td>'+money(x.sale_price)+'</td><td>'+money(x.total)+'</td><td>'+Number(x.markup_percent||0).toFixed(2)+'%</td></tr>').join("")+'</tbody></table>';el.style.display="block"}catch(e){el.textContent="Erro: "+e.message;el.style.display="block"}});load();</script></body></html>
