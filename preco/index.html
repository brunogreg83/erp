<!doctype html>
<html lang="pt-BR">
<head>
<meta name="frontend-version" content="2026-10-08-02">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB Chemicals | Controle de Preços</title>
<style>
:root{--blue:#0b1d2d;--cyan:#159bd7;--bg:#f4f7fa;--green:#d9f7e2;--yellow:#fff3c4;--red:#ffd9d9}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17212b}
header{background:var(--blue);color:#fff;padding:18px 20px}header h1{margin:0;font-size:21px}header small{opacity:.8}
nav{display:flex;gap:8px;padding:12px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:var(--cyan);color:white}.secondary{background:#e9eef2}.danger{background:#c62828;color:white}
main{max-width:1100px;margin:20px auto;padding:0 14px}.card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:8px;font-size:15px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e6eaee;text-align:left}th{font-size:13px;background:#f7f9fb}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;font-weight:800;font-size:12px}.green{background:var(--green)}.yellow{background:var(--yellow)}.red{background:var(--red)}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f7f9fb;border-radius:10px;padding:13px}.metric b{display:block;font-size:18px;margin-top:5px}
.hidden{display:none!important}.muted{color:#6d7780;font-size:13px}.right{text-align:right}.ok{color:#087a35;font-weight:700}.error{color:#b00020;font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<header><h1>AB Chemicals — Controle de Preços</h1><small>Vendas e Back-office</small></header>
<nav>
<button id="btnSales" class="primary" type="button">Vendas / Pedido</button>
<a href="admin.html"><button class="secondary" type="button">Back-office</button></a>
</nav>

<main>
<section id="sales" class="card">
<h2>Novo pedido</h2>
        <div style="margin:12px 0">
          <label>Cliente</label>
          <input id="orderCustomer" type="text" placeholder="Nome do cliente">
        </div>
<div class="grid">
<div><label>Produto</label><select id="product"></select></div>
<div><label>Quantidade</label><input id="qty" type="number" min="1" value="1"></div>
<div><label>Preço de venda (un.)</label><input id="price" type="number" min="0" step="0.01"></div>
<div><label>&nbsp;</label><button class="primary" onclick="addItem()">Adicionar ao pedido</button></div>
</div>
<div class="summary" style="margin-top:16px">
<div class="metric">Venda total<b id="totalSale">R$ 0,00</b></div>
<div class="metric">Custo total<b id="totalCost">R$ 0,00</b></div>
<div class="metric">Lucro<b id="totalProfit">R$ 0,00</b></div>
<div class="metric">Margem<b id="totalMargin">—</b></div>
<div class="metric">Margem padrão<b>100%</b></div>
<div class="metric">Quantidade de itens<b id="totalItems">0</b></div>
<div class="metric">Precificação do pedido<b id="totalStatus"><span class="badge yellow">⚪ SEM PEDIDO</span></b></div>
</div>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px">
  <button id="btnSaveOrder" class="primary" type="button">Salvar pedido</button>
  <button id="btnClearOrder" class="secondary" type="button">Limpar pedido</button>
  <span id="orderSaveMsg" class="muted"></span>
</div>
</section>

<section class="card" id="savedOrders">
<h2>Pedidos salvos</h2>
<p id="savedOrdersMsg" class="muted">Carregando pedidos...</p>
<div style="overflow:auto">
<table>
<thead><tr><th>ID</th><th>Cliente</th><th>Data</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
<tbody id="savedOrdersBody"></tbody>
</table>
</div>
</section>

</main>




<script>
const SUPABASE_URL = "https://divokbonqrmpindszoqv.supabase.co";
const SUPABASE_KEY = "sb_publishable_sCTeIxcTB-oUswA-QVP0Wg_LrlGgjhY";
let products=[], items=[];
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=v=>Number(String(v??0).replace(",","."))||0;
async function sb(path, options={}){
 const r=await fetch(SUPABASE_URL+path,{...options,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})}});
 const text=await r.text(); let data; try{data=text?JSON.parse(text):null}catch{data=text}
 if(!r.ok) throw new Error(data?.message||data?.hint||data?.error_description||text||("HTTP "+r.status));
 return data;
}


let currentOrderId=null;

async function saveOrderDraft(){
  const msg=document.getElementById('orderSaveMsg');
  try{
    if(!items || !items.length){
      msg.className='error';
      msg.textContent='Adicione pelo menos um item ao pedido.';
      return;
    }

    const customer=(document.getElementById('orderCustomer')?.value||'').trim();
    const total=items.reduce((s,x)=>s+(num(x.qty)*num(x.price)),0);
    const costTotal=items.reduce((s,x)=>s+(num(x.qty)*num(x.cost)),0);
    const profit=total-costTotal;
    const margin=costTotal?((profit/costTotal)*100):0;

    msg.className='muted';
    msg.textContent=currentOrderId ? 'Atualizando pedido '+currentOrderId+'...' : 'Salvando pedido...';

    const orderPayload={
      customer_name:customer,
      total:Number(total.toFixed(2)),
      cost_total:Number(costTotal.toFixed(2)),
      profit:Number(profit.toFixed(2)),
      margin_percent:Number(margin.toFixed(2)),
      status:'Orçamento'
    };

    const itemRows=items.map(x=>({
      order_id:currentOrderId,
      product_id:x.productId==null?null:String(x.productId),
      product_name:String(x.name||''),
      quantity:Number(num(x.qty)),
      cost:Number(num(x.cost).toFixed(2)),
      sale_price:Number(num(x.price).toFixed(2)),
      total:Number((num(x.qty)*num(x.price)).toFixed(2)),
      margin_percent:Number((num(x.cost)?(((num(x.price)-num(x.cost))/num(x.cost))*100):0).toFixed(2))
    }));

    let savedId;

    if(currentOrderId){
      // EDIÇÃO: altera o pedido existente, sem criar outro ID.
      const updated=await sb(
        '/rest/v1/preco_orders?id=eq.'+encodeURIComponent(currentOrderId),
        {
          method:'PATCH',
          headers:{Prefer:'return=representation'},
          body:JSON.stringify(orderPayload)
        }
      );

      const updatedOrder=Array.isArray(updated)?updated[0]:updated;
      if(!updatedOrder || !updatedOrder.id){
        throw new Error('O Supabase não confirmou a atualização do pedido.');
      }

      // Remove os itens antigos e grava os itens atuais.
      await sb(
        '/rest/v1/preco_order_items?order_id=eq.'+encodeURIComponent(currentOrderId),
        {method:'DELETE',headers:{Prefer:'return=minimal'}}
      );

      const rows=itemRows.map(x=>({...x,order_id:currentOrderId}));
      if(rows.length){
        await sb('/rest/v1/preco_order_items',{
          method:'POST',
          headers:{Prefer:'return=minimal'} ,
          body:JSON.stringify(rows)
        });
      }

      savedId=updatedOrder.id;
      msg.className='ok';
      msg.textContent='PEDIDO ATUALIZADO NO SUPABASE — ID: '+savedId;
    }else{
      // NOVO PEDIDO: usa a RPC existente para criar um novo ID.
      const rpcPayload={
        p_customer_name:customer,
        p_total:Number(total.toFixed(2)),
        p_cost_total:Number(costTotal.toFixed(2)),
        p_profit:Number(profit.toFixed(2)),
        p_margin_percent:Number(margin.toFixed(2)),
        p_status:'Orçamento',
        p_items:items.map(x=>({
          product_id:x.productId==null?null:String(x.productId),
          product_name:String(x.name||''),
          quantity:Number(num(x.qty)),
          cost:Number(num(x.cost).toFixed(2)),
          sale_price:Number(num(x.price).toFixed(2)),
          total:Number((num(x.qty)*num(x.price)).toFixed(2)),
          margin_percent:Number((num(x.cost)?(((num(x.price)-num(x.cost))/num(x.cost))*100):0).toFixed(2))
        }))
      };

      const result=await sb('/rest/v1/rpc/ab_save_order',{
        method:'POST',
        headers:{Prefer:'return=representation'},
        body:JSON.stringify(rpcPayload)
      });

      const saved=Array.isArray(result)?result[0]:result;
      if(!saved || !saved.id) throw new Error('O Supabase não retornou o ID do pedido.');

      savedId=saved.id;
      currentOrderId=saved.id;
      msg.className='ok';
      msg.textContent='PEDIDO SALVO NO SUPABASE — ID: '+savedId;
    }

    await loadSavedOrders();
  }catch(e){
    console.error(e);
    msg.className='error';
    msg.textContent='Erro ao salvar/atualizar: '+(e?.message||String(e));
  }
}

function clearOrderDraft(){
  items=[];
  currentOrderId=null;
  const saveBtn=document.getElementById('btnSaveOrder');
  if(saveBtn) saveBtn.textContent='Salvar pedido';
  const customer=document.getElementById('orderCustomer');
  if(customer) customer.value='';
  render();
  const msg=document.getElementById('orderSaveMsg');
  if(msg){
    msg.className='muted';
    msg.textContent='Novo pedido.';
  }
}



async function editSavedOrder(orderId){
  try{
    const orders=await sb('/rest/v1/preco_orders?id=eq.'+encodeURIComponent(orderId)+'&select=id,customer_name');
    const order=Array.isArray(orders)?orders[0]:null;
    if(!order) throw new Error('Pedido não encontrado.');

    const details=await sb('/rest/v1/preco_order_items?order_id=eq.'+encodeURIComponent(orderId)+'&select=product_id,product_name,quantity,cost,sale_price,total');
    items=(details||[]).map(x=>({
      productId:x.product_id,
      name:x.product_name,
      cost:num(x.cost),
      qty:num(x.quantity),
      price:num(x.sale_price),
      suggested:0,
      min:0
    }));
    currentOrderId=order.id;
    const saveBtn=document.getElementById('btnSaveOrder');
    if(saveBtn) saveBtn.textContent='Atualizar pedido';

    const customer=document.getElementById('orderCustomer');
    if(customer) customer.value=order.customer_name||'';
    render();

    const msg=document.getElementById('orderSaveMsg');
    if(msg){
      msg.className='muted';
      msg.textContent='Editando pedido ID '+order.id+'. Altere os dados e clique em Salvar pedido.';
    }

    document.getElementById('sales')?.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    const msg=document.getElementById('savedOrdersMsg');
    if(msg){
      msg.className='error';
      msg.textContent='Erro ao editar: '+(e?.message||String(e));
    }
    console.error(e);
  }
}

async function deleteSavedOrder(orderId){
  if(!confirm('Excluir o pedido ID '+orderId+'? Esta ação não pode ser desfeita.')) return;

  const msg=document.getElementById('savedOrdersMsg');
  try{
    await sb('/rest/v1/preco_order_items?order_id=eq.'+encodeURIComponent(orderId),{
      method:'DELETE',
      headers:{Prefer:'return=minimal'}
    });
    await sb('/rest/v1/preco_orders?id=eq.'+encodeURIComponent(orderId),{
      method:'DELETE',
      headers:{Prefer:'return=minimal'}
    });

    if(String(currentOrderId)===String(orderId)){
      items=[];
      currentOrderId=null;
      const customer=document.getElementById('orderCustomer');
      if(customer) customer.value='';
      render();
    }

    msg.className='ok';
    msg.textContent='Pedido ID '+orderId+' excluído.';
    await loadSavedOrders();
  }catch(e){
    msg.className='error';
    msg.textContent='Erro ao excluir pedido: '+(e?.message||String(e));
    console.error(e);
  }
}

window.editSavedOrder=editSavedOrder;
window.deleteSavedOrder=deleteSavedOrder;

async function loadSavedOrders(){
  const msg=document.getElementById('savedOrdersMsg');
  const body=document.getElementById('savedOrdersBody');
  if(!msg || !body) return;
  msg.className='muted';
  msg.textContent='Carregando pedidos...';
  body.innerHTML='';
  try{
    const rows=await sb('/rest/v1/preco_orders?select=id,customer_name,total,status,created_at&order=id.desc');
    if(!rows || !rows.length){
      msg.textContent='Nenhum pedido salvo encontrado.';
      return;
    }
    body.innerHTML=rows.map(o=>{
      const date=o.created_at ? new Date(o.created_at).toLocaleString('pt-BR') : '—';
      return `<tr>
        <td><strong>${escapeHtml(o.id)}</strong></td>
        <td>${escapeHtml(o.customer_name||'—')}</td>
        <td>${escapeHtml(date)}</td>
        <td>${money(o.total)}</td>
        <td>${escapeHtml(o.status||'—')}</td>
        <td style="white-space:nowrap">
          <button class="secondary" type="button" onclick="editSavedOrder(${Number(o.id)})">Editar</button>
          <button class="danger" type="button" onclick="deleteSavedOrder(${Number(o.id)})">Excluir</button>
        </td>
      </tr>`;
    }).join('');
    msg.textContent=`${rows.length} pedido(s) salvo(s).`;
  }catch(e){
    console.error(e);
    msg.className='error';
    msg.textContent='Erro ao carregar pedidos: '+(e?.message||String(e));
  }
}

async function loadProducts(){
 const q=await sb('/rest/v1/preco_products?select=id,code,name,cost,margin_percent,suggested_price,current_price,active&active=eq.true&order=name.asc');
 products=(q||[]).map(p=>({...p,min_price:0}));
 const el=document.getElementById('product');
 el.innerHTML=products.length?products.map(p=>'<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>').join(''):'<option value="">Nenhum produto cadastrado</option>';
 if(products.length) document.getElementById('price').value=products[0].current_price??'';
}
document.getElementById('product').addEventListener('change',()=>{
 const p=products.find(x=>String(x.id)===String(document.getElementById('product').value));
 document.getElementById('price').value=p?.current_price??'';
});
function escapeHtml(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function addItem(){const p=products.find(x=>String(x.id)===String(document.getElementById('product').value));if(!p)return;const q=Math.max(1,num(document.getElementById('qty').value)),pr=num(document.getElementById('price').value);items.push({productId:p.id,name:p.name,cost:num(p.cost),suggested:num(p.suggested_price),min:num(p.min_price),qty:q,price:pr});render()}
window.addItem=addItem;window.removeItem=i=>{items.splice(i,1);render()};
function priceStatus(price,suggested,min){const p=num(price),s=num(suggested),m=num(min);if(m>0&&p<m)return ['red','🔴 VERMELHO'];if(s>0&&p<s)return ['yellow','🟡 AMARELO'];return ['green','🟢 VERDE']}
function render(){const tbody=document.getElementById('items');let total=0,costTotal=0,suggestedTotal=0,minTotal=0;items.forEach(x=>{const t=num(x.qty)*num(x.price),cost=num(x.qty)*num(x.cost);total+=t;costTotal+=cost;suggestedTotal+=num(x.qty)*num(x.suggested);minTotal+=num(x.qty)*num(x.min)});if(tbody)tbody.innerHTML='';const totalEl=document.getElementById('totalSale');if(totalEl)totalEl.textContent=money(total);const costEl=document.getElementById('totalCost');if(costEl)costEl.textContent=money(costTotal);const profit=total-costTotal;const profitEl=document.getElementById('totalProfit');if(profitEl)profitEl.textContent=money(profit);const itemsEl=document.getElementById('totalItems');if(itemsEl)itemsEl.textContent=String(items.reduce((s,x)=>s+num(x.qty),0));const marginEl=document.getElementById('totalMargin');if(marginEl)marginEl.textContent=costTotal?((profit/costTotal)*100).toFixed(1)+'%':'—';const statusEl=document.getElementById('totalStatus');if(statusEl){const overall=items.length?priceStatus(total,suggestedTotal,minTotal):['yellow','⚪ SEM PEDIDO'];statusEl.innerHTML=`<span class="badge ${overall[0]}">${overall[1]}</span>`}}

document.addEventListener('DOMContentLoaded',()=>{const saveBtn=document.getElementById('btnSaveOrder');const clearBtn=document.getElementById('btnClearOrder');if(saveBtn)saveBtn.addEventListener('click',saveOrderDraft);if(clearBtn)clearBtn.addEventListener('click',clearOrderDraft);const refreshOrders=document.getElementById('btnRefreshOrders');if(refreshOrders)refreshOrders.addEventListener('click',loadSavedOrders);loadSavedOrders();});

loadProducts().catch(e=>{console.error(e);document.getElementById('product').innerHTML='<option>Erro ao carregar produtos</option>'});

</script>
</body>
</html>
