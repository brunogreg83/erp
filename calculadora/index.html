<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a4fa0">
<meta name="apple-mobile-web-app-title" content="AB Chemicals">
<title>Calculadora AB Chemicals</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--blue:#1a4fa0;--blue-light:#2b7fff;--blue-dark:#0e3070;--blue-pale:#eef4ff;--white:#ffffff;--off-white:#f7faff;--gray:#d1dce8;--text:#0e1a2e;--text-muted:#5a7190;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;}
  body{background:linear-gradient(180deg,#f7faff 0%,#eef4ff 100%);color:var(--text);font-family:'Nunito',sans-serif;display:flex;justify-content:center;min-height:100vh;}
  .app{width:100%;max-width:460px;height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .card{background:var(--white);border-radius:0;box-shadow:0 20px 50px rgba(26,79,160,0.14);overflow:hidden;display:flex;flex-direction:column;flex:1;}
  .card-header{background:linear-gradient(135deg,var(--blue),var(--blue-light));padding:12px 16px;color:#fff;display:flex;align-items:center;gap:14px;flex-shrink:0;border-radius:0;min-height:80px;justify-content:flex-start;}
  .card-header .brand{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;font-family:'Montserrat',sans-serif;font-size:.9rem;font-weight:800;letter-spacing:.02em;white-space:nowrap;}
  .card-header .brand-phone{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#fff;
    text-decoration:none;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:0;
    opacity:.95;
  }
  .card-header .whatsapp-icon{
    width:.72rem;
    height:.72rem;
    flex:0 0 .72rem;
  }
  .card-header .whatsapp-link:hover{opacity:1;text-decoration:none;}
  function fmt(n){return n.toLocaleString('pt-BR',{maximumFractionDigits:1});}
  function parseNum(val){return parseFloat(String(val).replace(',','.'));}
  function render(){
    var ratioNum=parseNum(ratioInput.value), volumeNum=parseNum(volumeInput.value), valid=ratioNum>0&&volumeNum>0;
    buildPresets(ratioPresetsEl,RATIO_PRESETS,':',function(){return ratioNum;},function(v){ratioInput.value=String(v);render();});
    buildPresets(volumePresetsEl,VOLUME_PRESETS,'L',function(){return volumeNum;},function(v){volumeInput.value=String(v);render();});
    if(valid){
      var totalML=volumeNum*1000, productML=totalML/ratioNum, waterML=totalML-productML, concentration=100/ratioNum, ppm=1000000/ratioNum;
      resultProduct.textContent=fmt(productML);resultWater.textContent=fmt(waterML);resultConcentration.textContent=fmt(concentration)+'%';resultPpm.textContent=fmt(ppm);
    }else{
      resultProduct.textContent='0';resultWater.textContent='0';resultConcentration.textContent='0%';resultPpm.textContent='0';
    }
  }
  ratioInput.addEventListener('input',render);volumeInput.addEventListener('input',render);render();
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
