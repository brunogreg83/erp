name: Convert Synthera image to lossless WebP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/convert-synthera-image.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: synthera-image-conversion
  cancel-in-progress: false

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert to lossless WebP and verify exact pixels
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          import sys

          png = Path("synthera/synthera-galao.png")
          webp = Path("synthera/synthera-galao.webp")
          html = Path("synthera/index.html")

          if not png.exists() or not html.exists():
              raise SystemExit("Arquivo de origem ou HTML não encontrado; nada foi publicado.")

          with Image.open(png) as source:
              original = source.convert("RGBA")
              original_size = png.stat().st_size
              original.save(webp, "WEBP", lossless=True, exact=True, method=6)

          with Image.open(webp) as converted_file:
              converted = converted_file.convert("RGBA")
              if original.size != converted.size:
                  raise SystemExit("Falha: as dimensões mudaram.")
              diff = ImageChops.difference(original, converted)
              if diff.getbbox():
                  raise SystemExit("Falha: os pixels ou a transparência mudaram. Não publicar.")
              converted_size = webp.stat().st_size

          if converted_size >= original_size:
              webp.unlink(missing_ok=True)
              raise SystemExit(f"WebP lossless não ficou menor ({converted_size} >= {original_size}); HTML mantido sem alteração.")

          content = html.read_text(encoding="utf-8")
          old = 'const SYNTHERA_GALAO_TRANSPARENTE = "./synthera-galao.png";'
          new = 'const SYNTHERA_GALAO_TRANSPARENTE = "./synthera-galao.webp";'
          if content.count(old) != 1:
              raise SystemExit("Referência esperada não encontrada exatamente uma vez; HTML não alterado.")
          html.write_text(content.replace(old, new), encoding="utf-8")

          print(f"PNG original: {original_size:,} bytes")
          print(f"WebP lossless: {converted_size:,} bytes")
          print(f"Redução da imagem: {(1-converted_size/original_size)*100:.1f}%")
          print(f"Dimensões preservadas: {original.width}x{original.height}")
          print("Verificação pixel a pixel RGBA: idêntica.")
          PY

      - name: Remove temporary workflow and replace original asset
        run: |
          rm synthera/synthera-galao.png
          rm .github/workflows/convert-synthera-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Converte imagem Synthera para WebP sem perda de qualidade"
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
